<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styleform.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" href="favicon_peixe.png" />
    <title>Gespo'App / Produtor</title>
  </head>
  <body>
    <main>
      <header style="justify-content: space-between">
        <div class="dropdown">
          <button class="dropbtn"><i class="fas fa-bars"></i></button>
          <div class="dropdown-content">
            <a href="index.html">Início</a>
            <a href="produtor.html">Produtor</a>
            <a href="producao.html">Produção</a>
            <a href="receitas.html">Receitas</a>
            <a href="despesas.html">Despesas</a>
            <a href="patrimonio.html">Patrimônio</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="documentos.html">Documentos</a>
          </div>
        </div>
        <h3>Dados do produtor</h3>
        <div style="width: 40px"></div>
        <!-- Espaçador para manter o título centralizado -->
        <div
          class="user-profile"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            color: inherit;
          "
        >
          <i class="fas fa-user-circle" style="font-size: 2rem"></i>
          <span
            id="nome-usuario"
            style="margin-top: 5px; font-size: 0.9rem; font-weight: bold"
            >Usuário</span
          >
          <a
            href="login.html"
            style="
              font-size: 0.75rem;
              color: inherit;
              margin-top: 2px;
              text-decoration: underline;
            "
            >Logout</a
          >
        </div>
      </header>
      <section style="display: flex; justify-content: space-between">
        <div>
          <a href="index.html" target="_self"
            ><button id="botao-form">INÍCIO</button></a
          >
        </div>
        <div>
          <a href="producao.html" target="_self"
            ><button id="botao-form">PRÓXIMA →</button></a
          >
        </div>
      </section>
      <section>
        <form id="form-produtor">
          <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome do produtor</label>
            <input id="nome" type="text" name="produtorNome" required />
            <br />

            <label for="primnome">Nome usuário</label>
            <input id="primnome" type="text" name="produtorPrimNome" required />
            <br />

            <label for="passUser">Senha de acesso</label>
            <input
              id="passUser"
              type="password"
              name="produtorPassUser"
              required
            />
            <br />

            <p>Gênero:</p>
            <input
              id="fem"
              type="radio"
              name="produtorGenero"
              value="Feminino"
            />
            <label for="fem">Feminino</label>
            <br />
            <input
              id="masc"
              type="radio"
              name="produtorGenero"
              value="Masculino"
            />
            <label for="masc">Masculino</label>
            <br />
            <input
              id="nInformado"
              type="radio"
              name="produtorGenero"
              value="nInformado"
            />
            <label for="nInformado">Prefiro não informar</label>
            <br />

            <label for="cpf">Cpf/Cnpj</label>
            <input id="cpf" type="text" name="produtorCpf" />
            <br />
            <label for="nascData">Data de nascimento</label>
            <input id="nascData" type="date" name="produtorNascData" />
            <br />
            <label for="celular">Celular</label>
            <input
              id="celular"
              type="tel"
              name="produtorCelular"
              pattern="[0-9]{11}"
              placeholder="digite apenas números - Cod.Área + número"
            />
            <br />
            <label for="email">Email</label>
            <input id="email" type="email" name="produtorEmail" />
            <br />

            <p>Tipo de produtor:</p>
            <input
              id="ini"
              type="radio"
              name="produtorTipo"
              value="iniciante"
            />
            <label for="ini">Iniciante</label>
            <br />
            <input id="fam" type="radio" name="produtorTipo" value="familiar" />
            <label for="fam">Familiar</label>
            <br />
            <input
              id="prof"
              type="radio"
              name="produtorTipo"
              value="profissional"
            />
            <label for="prof">Profissional</label>
            <br />
            <input
              id="com"
              type="radio"
              name="produtorTipo"
              value="comercial"
            />
            <label for="prof">Comercial/exportador</label>
            <br />

            <label for="foto">Upload de foto</label>
            <input id="foto" type="file" accept="image/*" name="produtorFoto" />
          </fieldset>
          <br />
          <button type="submit">Salvar</button>
          <button type="reset">Limpar</button>
        </form>
      </section>

      <!-- Pop-up de sucesso -->
      <div
        id="popup-sucesso"
        style="
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: #4caf50;
          color: white;
          padding: 20px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          z-index: 1000;
          text-align: center;
        "
      >
        <h2>Registro salvo com sucesso</h2>
      </div>
    </main>
    <script>
      // Carregar os dados ao abrir a tela
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const baseUrl =
            window.location.port === "3000" ? "" : "http://localhost:3000";
          //          const baseUrl = "https://gespo.onrender.com";
          const response = await fetch(
            `/dados_produtor.json?t=${new Date().getTime()}`,
          );

          if (response.ok) {
            const dados = await response.json();

            // Preenche os campos de forma dinâmica
            for (const key in dados) {
              const values = Array.isArray(dados[key])
                ? dados[key]
                : [dados[key]];
              const inputs = document.querySelectorAll(`[name="${key}"]`);

              if (inputs.length > 0) {
                const type = inputs[0].type;
                // Trata checkboxes e radios
                if (type === "radio" || type === "checkbox") {
                  values.forEach((val) => {
                    const el = document.querySelector(
                      `input[name="${key}"][value="${val}"]`,
                    );
                    if (el) el.checked = true;
                  });
                } else if (type !== "file") {
                  // Trata inputs de texto comum, ignorando campo de arquivo (foto)
                  inputs[0].value = dados[key];
                }
              }
            }
          }
        } catch (error) {
          console.error("Erro ao recuperar os dados:", error);
        }
      });

      // Salvar os dados do formulário
      document
        .getElementById("form-produtor")
        .addEventListener("submit", async (e) => {
          e.preventDefault(); // Evita o recarregamento da página

          const formData = new FormData(e.target);
          const dados = {};

          // Prepara os dados, removendo o objeto físico da foto para não quebrar o JSON.stringify
          formData.forEach((value, key) => {
            if (value instanceof File) {
              dados[key] = value.name ? { filename: value.name } : {};
            } else {
              dados[key] = value;
            }
          });

          try {
            const baseUrl =
              window.location.port === "3000" ? "" : "http://localhost:3000";
            //           const baseUrl = "https://gespo.onrender.com";
            const response = await fetch(`/api/salvar-json-produtor`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(dados),
            });

            if (response.ok) {
              const popup = document.getElementById("popup-sucesso");
              popup.style.display = "block";

              setTimeout(() => {
                popup.style.display = "none";
                carregarUsuario(); // Atualiza os dados no cabeçalho
              }, 3000);
            } else {
              const errorText = await response.text();
              alert(
                "Erro ao salvar os dados no arquivo JSON. Detalhe: " +
                  errorText,
              );
            }
          } catch (error) {
            console.error("Erro ao salvar:", error);
            alert("Erro de comunicação com o servidor.");
          }
        });
    </script>
  </body>
  <script>
    // Função para buscar e exibir o nome do usuário
    async function carregarUsuario() {
      try {
        const baseUrl =
          window.location.port === "3000" ? "" : "http://localhost:3000";
        //               const baseUrl = "https://gespo.onrender.com";
        const response = await fetch(
          `/dados_produtor.json?t=${new Date().getTime()}`,
        );
        if (response.ok) {
          const dados = await response.json();
          if (dados.produtorPrimNome) {
            document.getElementById("nome-usuario").textContent =
              dados.produtorPrimNome;
          }
        }
      } catch (error) {
        console.error("Erro ao carregar o usuário:", error);
      }
    }
    // Inicia a página carregando todos os peixes (busca vazia) e os dados do usuário
    document.addEventListener("DOMContentLoaded", () => {
      carregarUsuario();
    });
  </script>
</html>
