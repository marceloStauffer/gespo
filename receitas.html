<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styleform.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" href="favicon_peixe.png" />
    <title>Gespo'App / Receitas</title>
  </head>
  <body>
    <main>
      <header style="justify-content: space-between">
        <div class="dropdown">
          <button class="dropbtn"><i class="fas fa-bars"></i></button>
          <div class="dropdown-content">
            <a href="index.html">Início</a>
            <a href="produtor.html">Produtor</a>
            <a href="producao.html">Produção</a>
            <a href="receitas.html">Receitas</a>
            <a href="despesas.html">Despesas</a>
            <a href="patrimonio.html">Patrimônio</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="documentos.html">Documentos</a>
          </div>
        </div>
        <h3>Receitas</h3>
        <div style="width: 40px"></div>
        <!-- Espaçador para manter o título centralizado -->
        <div
          class="user-profile"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            color: inherit;
          "
        >
          <i class="fas fa-user-circle" style="font-size: 2rem"></i>
          <span
            id="nome-usuario"
            style="margin-top: 5px; font-size: 0.9rem; font-weight: bold"
            >Usuário</span
          >
          <a href="login.html" style="font-size: 0.75rem; color: inherit; margin-top: 2px; text-decoration: underline;">Logout</a>
        </div>
      </header>
      <section
        id="navegacao-secoes"
        style="display: flex; justify-content: space-between"
      >
        <div>
          <a href="producao.html" target="_self"
            ><button id="botao-form">← ANTERIOR</button></a
          >
        </div>
        <div>
          <a href="despesas.html" target="_self"
            ><button id="botao-form">PRÓXIMA →</button></a
          >
        </div>
      </section>
      <section>
        <form id="form-receitas">
          <fieldset>
            <legend>Receita</legend>

            <label for="recData">Data da receita:</label>
            <input id="recData" type="date" name="receitasData" />
            <br />

            <label for="recDescricao">Descrição:</label>
            <input
              id="recDescricao"
              type="text"
              name="receitasDescricao"
              required
            />
            <br />

            <label for="recGrupo">Grupo:</label>
            <select id="recGrupo" name="receitasGrupo">
              <option value="notInformed">
                Selecione o grupo da receita...
              </option>
              <option value="recGrupoPeixes">Venda de peixes</option>
              <option value="recGrupoPlantas">
                Venda de plantas aquáticas
              </option>
              <option value="recGrupoInsumos">
                Venda de insumos e produtos
              </option>
              <option value="recGrupoServicos">Prestação de serviços</option>
              <option value="recGrupoOutras">Outras receitas</option>
            </select>
            <br />

            <label for="recSubgrupo">Subgrupo:</label>
            <select id="recSubgrupo" name="receitasSubgrupo">
              <option value="notInformed">
                Selecione o subgrupo da receita...
              </option>
            </select>
            <br />

            <label for="recEspecie">Espécie vendida:</label>
            <input
              id="recEspecie"
              type="text"
              name="receitasEspecie"
              disabled
            />
            <br />

            <label for="recQuant">Quantidade:</label>
            <input
              element.defaultValue="1"
              id="recQuant"
              type="number"
              name="receitasQuant"
              required
            />
            <br />

            <label for="recValor">Valor total:</label>
            <input
              id="recValor"
              type="number"
              step="0.01"
              name="receitasValor"
            />
            <br />

            <label for="recObs">Obs.:</label>
            <input id="recObs" type="text" name="receitasObs" />
          </fieldset>
          <br />
          <div style="display: flex; gap: 10px">
            <button
              type="button"
              id="btn-submit"
              style="width: 180px; height: 40px; margin-right: 0"
            >
              Salvar/Editar
            </button>
            <button
              type="reset"
              id="btn-reset"
              style="width: 180px; height: 40px; margin-right: 0"
            >
              Limpar
            </button>
            <button
              type="button"
              id="btn-voltar-relatorio"
              style="
                display: none;
                background-color: #6c757d;
                color: white;
                width: 180px;
                height: 40px;
                margin-right: 0;
              "
            >
              Voltar para Relatório
            </button>
          </div>
        </form>
      </section>

      <!-- Pop-up de sucesso -->
      <div
        id="popup-sucesso"
        style="
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: #4caf50;
          color: white;
          padding: 20px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          z-index: 1000;
          text-align: center;
        "
      >
        <h2>Dados enviados com sucesso!</h2>
      </div>
    </main>
    <script>
      const subgrupos = {
        recGrupoPeixes: [
          { value: "recSubgrupoAdultos", text: "Peixes adultos" },
          { value: "recSubgrupoAlevinos", text: "Alevinos" },
          { value: "recSubgrupoMatrizes", text: "Matrizes/Reprodutores" },
          { value: "recSubgrupoOutros", text: "Outros peixes" },
        ],
        recGrupoPlantas: [
          { value: "recSubgrupoMudas", text: "Mudas" },
          { value: "recSubgrupoCarpete", text: "Carpetes" },
          { value: "recSubgrupoVasos", text: "Plantas em vasos" },
        ],
        recGrupoInsumos: [
          { value: "recSubgrupoAlimentacao", text: "Alimentação" },
          {
            value: "recSubgrupoCondicionadores",
            text: "Condicionadores e medicamentos",
          },
          {
            value: "recSubgrupoEquipamentos",
            text: "Equipamentos e acessórios",
          },
          { value: "recSubgrupoAquarios", text: "Aquários e terrários" },
        ],
        recGrupoServicos: [
          { value: "recSubgrupoConsultoria", text: "Consultoria e projetos" },
          { value: "recSubgrupoManutencao", text: "Manutenção" },
          { value: "recSubgrupoTreinamento", text: "Treinamentos e mentorias" },
        ],
        recGrupoOutras: [
          {
            value: "recSubgrupoResiduos",
            text: "Venda de resíduos / subprodutos",
          },
          { value: "recSubgrupoFretes", text: "Fretes e entregas" },
          { value: "recSubgrupoRecfin", text: "Rec. financeiras" },
          { value: "recSubgrupoRecoutras", text: "Outras receitas" },
        ],
      };

      const grupoSelect = document.getElementById("recGrupo");
      const subgrupoSelect = document.getElementById("recSubgrupo");
      const especieInput = document.getElementById("recEspecie");

      grupoSelect.addEventListener("change", function () {
        const grupoSelecionado = this.value;

        // Habilita o campo de espécie apenas se "Venda de peixes" for selecionado
        if (grupoSelecionado === "recGrupoPeixes") {
          especieInput.disabled = false;
        } else {
          especieInput.disabled = true;
          especieInput.value = ""; // Limpa o valor caso troque de opção
        }

        subgrupoSelect.innerHTML =
          '<option value="notInformed">Selecione o subgrupo da receita...</option>';

        if (subgrupos[grupoSelecionado]) {
          subgrupos[grupoSelecionado].forEach((sub) => {
            const option = document.createElement("option");
            option.value = sub.value;
            option.textContent = sub.text;
            subgrupoSelect.appendChild(option);
          });
        }
      });

      // Verifica se está no modo de edição pela URL (?edit=0, por exemplo)
      const urlParams = new URLSearchParams(window.location.search);
      const editIndex = urlParams.get("edit");

      if (editIndex !== null) {
        document.addEventListener("DOMContentLoaded", async () => {
          // Altera a interface dos botões para o modo de edição
          document.getElementById("btn-reset").style.display = "none";
          document.getElementById("navegacao-secoes").style.display = "none";
          const btnVoltar = document.getElementById("btn-voltar-relatorio");
          btnVoltar.style.display = "inline-block";

          // Adiciona o evento de clique para o novo botão
          btnVoltar.addEventListener("click", () => {
            let redirectUrl = "relatorio_receitas.html";
            const paramInicio = urlParams.get("inicio");
            const paramFim = urlParams.get("fim");
            const params = [];
            if (paramInicio) params.push(`inicio=${paramInicio}`);
            if (paramFim) params.push(`fim=${paramFim}`);
            if (params.length > 0) redirectUrl += `?${params.join("&")}`;
            window.location.href = redirectUrl;
          });

          try {
            const baseUrl =
              window.location.port === "3000" ? "" : "http://localhost:3000";
            const response = await fetch(
              `${baseUrl}/dados_receitas.json?t=${new Date().getTime()}`,
            );
            if (response.ok) {
              const dados = await response.json();
              const registro = dados[editIndex];
              if (registro) {
                document.getElementById("recData").value =
                  registro.receitasData || "";
                document.getElementById("recDescricao").value =
                  registro.receitasDescricao || "";
                document.getElementById("recGrupo").value =
                  registro.receitasGrupo || "notInformed";
                grupoSelect.dispatchEvent(new Event("change")); // Dispara o evento para carregar o subgrupo
                document.getElementById("recSubgrupo").value =
                  registro.receitasSubgrupo || "notInformed";
                document.getElementById("recEspecie").value =
                  registro.receitasEspecie || "";
                document.getElementById("recQuant").value =
                  registro.receitasQuant || "1";
                document.getElementById("recValor").value =
                  registro.receitasValor || "";
                document.getElementById("recObs").value =
                  registro.receitasObs || "";
              }
            }
          } catch (error) {
            console.error("Erro ao carregar edição:", error);
          }
        });
      }

      // Salvar os dados do formulário de receitas
      document
        .getElementById("btn-submit")
        .addEventListener("click", async (e) => {
          e.preventDefault(); // Evita recarregamento fantasma
          const form = document.getElementById("form-receitas");

          // Valida os campos obrigatórios antes de prosseguir
          if (!form.checkValidity()) {
            form.reportValidity();
            return;
          }

          const formData = new FormData(form);
          const dados = {};

          formData.forEach((value, key) => {
            dados[key] = value;
          });

          try {
            const baseUrl =
              window.location.port === "3000" ? "" : "http://localhost:3000";

            const url =
              editIndex !== null
                ? `${baseUrl}/api/receitas/${editIndex}`
                : `${baseUrl}/api/salvar-json-receitas`;
            const methodForm = editIndex !== null ? "PUT" : "POST";

            const response = await fetch(url, {
              method: methodForm,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(dados),
            });

            if (response.ok) {
              if (editIndex !== null) {
                // No modo de edição, apenas confirma o salvamento.
                // O usuário usará o botão "Voltar para Relatório" para navegar.
                alert("Lançamento atualizado com sucesso!");
              } else {
                // No modo de criação, exibe o pop-up e limpa o formulário.
                const popup = document.getElementById("popup-sucesso");
                popup.innerHTML = "<h2>Dados enviados com sucesso!</h2>";
                popup.style.display = "block";

                setTimeout(() => {
                  popup.style.display = "none";
                  form.reset(); // Limpa os campos do formulário para um novo envio
                }, 3000); // 3 Segundos de espera para novos cadastros
              }
            } else {
              const errorText = await response.text();
              alert(
                "Erro ao salvar os dados no arquivo JSON. Detalhe: " +
                  errorText,
              );
            }
          } catch (error) {
            console.error("Erro ao salvar:", error);
            alert("Erro de comunicação com o servidor.");
          }
        });
    </script>
  </body>
  <script>
    // Função para buscar e exibir o nome do usuário
    async function carregarUsuario() {
      try {
        const baseUrl =
          window.location.port === "3000" ? "" : "http://localhost:3000";
        const response = await fetch(
          `${baseUrl}/dados_produtor.json?t=${new Date().getTime()}`,
        );
        if (response.ok) {
          const dados = await response.json();
          if (dados.produtorPrimNome) {
            document.getElementById("nome-usuario").textContent =
              dados.produtorPrimNome;
          }
        }
      } catch (error) {
        console.error("Erro ao carregar o usuário:", error);
      }
    }
    // Inicia a página carregando todos os peixes (busca vazia) e os dados do usuário
    document.addEventListener("DOMContentLoaded", () => {
      carregarUsuario();
    });
  </script>
</html>
