<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styleform.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="icon" href="favicon_peixe.png" />
    <title>Gespo'App / Patrimônio</title>
  </head>
  <body>
    <main>
      <header style="justify-content: space-between">
        <div class="dropdown">
          <button class="dropbtn"><i class="fas fa-bars"></i></button>
          <div class="dropdown-content">
            <a href="index.html">Início</a>
            <a href="produtor.html">Produtor</a>
            <a href="producao.html">Produção</a>
            <a href="receitas.html">Receitas</a>
            <a href="despesas.html">Despesas</a>
            <a href="patrimonio.html">Patrimônio</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="documentos.html">Documentos</a>
          </div>
        </div>
        <h3>Patrimônio - Bens</h3>
        <div style="width: 40px"></div>
        <!-- Espaçador para manter o título centralizado -->
        <div
          class="user-profile"
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            color: inherit;
          "
        >
          <i class="fas fa-user-circle" style="font-size: 2rem"></i>
          <span
            id="nome-usuario"
            style="margin-top: 5px; font-size: 0.9rem; font-weight: bold"
            >Usuário</span
          >
        </div>
      </header>
      <section
        id="navegacao-secoes"
        style="display: flex; justify-content: space-between"
      >
        <div>
          <a href="despesas.html" target="_self"
            ><button id="botao-form">← ANTERIOR</button></a
          >
        </div>
        <div>
          <a href="relatorios.html" target="_self"
            ><button id="botao-form">PRÓXIMA →</button></a
          >
        </div>
      </section>
      <section>
        <form id="form-patrimonio">
          <fieldset>
            <legend>Dados do bem patrimonial</legend>

            <label for="cadData">Data do cadastro:</label>
            <input id="cadData" type="date" name="patrimonioCadData" />
            <br />

            <label for="patrimonioNome">Bem patrimonial:</label>
            <input
              id="patrimonioNome"
              type="text"
              name="patrimonioNome"
              required
            />
            <br />

            <label for="patrimonioQuant">Quantidade:</label>
            <input
              element.defaultValue="1"
              id="patrimonioQuant"
              type="number"
              name="patrimonioQuant"
              required
            />
            <br />

            <label for="patrimonioVida">Vida útil (anos):</label>
            <input id="patrimonioVida" type="number" name="patrimonioVida" />
            <br />

            <label for="patrimonioGrupo">Grupo:</label>
            <select id="patrimonioGrupo" name="patrimonioGrupo">
              <option value="notInformed">Selecione...</option>
              <option value="bensAquario">Aquário</option>
              <option value="bensEquip">Equipamentos</option>
              <option value="bensFerrament">Ferramentas</option>
              <option value="bensImovel">Imóveis</option>
              <option value="bensInstal">Instalações</option>
            </select>
            <br />

            <label for="patrimonioValor">Valor atual do bem</label>
            <input
              id="patrimonioValor"
              type="number"
              step="0.01"
              name="patrimonioValor"
            />
            <br />

            <label for="patrimonioSucata">Valor residual (sucata)</label>
            <input
              id="patrimonioSucata"
              type="number"
              step="0.01"
              name="patrimonioSucata"
            />
            <br />

            <label for="patrimonioObs">Obs.</label>
            <input id="patrimonioObs" type="text" name="patrimonioObs" />
          </fieldset>
          <br />
          <div style="display: flex; gap: 10px">
            <button
              type="button"
              id="btn-submit"
              style="width: 180px; height: 40px; margin-right: 0"
            >
              Salvar/Editar
            </button>
            <button
              type="reset"
              id="btn-reset"
              style="width: 180px; height: 40px; margin-right: 0"
            >
              Limpar
            </button>
            <button
              type="button"
              id="btn-voltar-relatorio"
              style="
                display: none;
                background-color: #6c757d;
                color: white;
                width: 180px;
                height: 40px;
                margin-right: 0;
              "
            >
              Voltar para Relatório
            </button>
          </div>
        </form>
      </section>

      <!-- Pop-up de sucesso -->
      <div
        id="popup-sucesso"
        style="
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: #4caf50;
          color: white;
          padding: 20px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          z-index: 1000;
          text-align: center;
        "
      >
        <h2>Dados enviados com sucesso!</h2>
      </div>
    </main>
    <script>
      // Verifica se está no modo de edição pela URL (?edit=0, por exemplo)
      const urlParams = new URLSearchParams(window.location.search);
      const editIndex = urlParams.get("edit");

      if (editIndex !== null) {
        document.addEventListener("DOMContentLoaded", async () => {
          // Altera a interface dos botões para o modo de edição
          document.getElementById("btn-reset").style.display = "none";
          document.getElementById("navegacao-secoes").style.display = "none";
          const btnVoltar = document.getElementById("btn-voltar-relatorio");
          btnVoltar.style.display = "inline-block";

          // Adiciona o evento de clique para o novo botão
          btnVoltar.addEventListener("click", () => {
            let redirectUrl = "relatorio_patrimonio.html";
            const paramInicio = urlParams.get("inicio");
            const paramFim = urlParams.get("fim");
            const params = [];
            if (paramInicio) params.push(`inicio=${paramInicio}`);
            if (paramFim) params.push(`fim=${paramFim}`);
            if (params.length > 0) redirectUrl += `?${params.join("&")}`;
            window.location.href = redirectUrl;
          });

          try {
            const baseUrl =
              window.location.port === "3000" ? "" : "http://localhost:3000";
            const response = await fetch(
              `${baseUrl}/dados_patrimonio.json?t=${new Date().getTime()}`,
            );
            if (response.ok) {
              const dados = await response.json();
              const registro = dados[editIndex];
              if (registro) {
                document.getElementById("cadData").value =
                  registro.patrimonioCadData || "";
                document.getElementById("patrimonioNome").value =
                  registro.patrimonioNome || "";
                document.getElementById("patrimonioQuant").value =
                  registro.patrimonioQuant || "1";
                document.getElementById("patrimonioVida").value =
                  registro.patrimonioVida || "";
                document.getElementById("patrimonioGrupo").value =
                  registro.patrimonioGrupo || "notInformed";
                document.getElementById("patrimonioValor").value =
                  registro.patrimonioValor || "";
                document.getElementById("patrimonioSucata").value =
                  registro.patrimonioSucata || "";
                document.getElementById("patrimonioObs").value =
                  registro.patrimonioObs || "";
              }
            }
          } catch (error) {
            console.error("Erro ao carregar edição:", error);
          }
        });
      }

      // Salvar os dados do formulário de patrimônio
      document
        .getElementById("btn-submit")
        .addEventListener("click", async (e) => {
          e.preventDefault(); // Evita recarregamento fantasma
          const form = document.getElementById("form-patrimonio");

          // Valida os campos obrigatórios antes de prosseguir
          if (!form.checkValidity()) {
            form.reportValidity();
            return;
          }

          const formData = new FormData(form);
          const dados = {};

          formData.forEach((value, key) => {
            dados[key] = value;
          });

          try {
            const baseUrl =
              window.location.port === "3000" ? "" : "http://localhost:3000";

            const url =
              editIndex !== null
                ? `${baseUrl}/api/patrimonio/${editIndex}`
                : `${baseUrl}/api/salvar-json-patrimonio`;
            const methodForm = editIndex !== null ? "PUT" : "POST";

            const response = await fetch(url, {
              method: methodForm,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(dados),
            });

            if (response.ok) {
              if (editIndex !== null) {
                alert("Lançamento atualizado com sucesso!");
              } else {
                const popup = document.getElementById("popup-sucesso");
                popup.innerHTML = "<h2>Dados enviados com sucesso!</h2>";
                popup.style.display = "block";

                setTimeout(() => {
                  popup.style.display = "none";
                  form.reset(); // Limpa os campos do formulário para um novo envio
                }, 3000); // 3 Segundos de espera para novos cadastros
              }
            } else {
              const errorText = await response.text();
              alert(
                "Erro ao salvar os dados no arquivo JSON. Detalhe: " +
                  errorText,
              );
            }
          } catch (error) {
            console.error("Erro ao salvar:", error);
            alert("Erro de comunicação com o servidor.");
          }
        });
    </script>
  </body>
  <script>
    // Função para buscar e exibir o nome do usuário
    async function carregarUsuario() {
      try {
        const baseUrl =
          window.location.port === "3000" ? "" : "http://localhost:3000";
        const response = await fetch(
          `${baseUrl}/dados_produtor.json?t=${new Date().getTime()}`,
        );
        if (response.ok) {
          const dados = await response.json();
          if (dados.produtorPrimNome) {
            document.getElementById("nome-usuario").textContent =
              dados.produtorPrimNome;
          }
        }
      } catch (error) {
        console.error("Erro ao carregar o usuário:", error);
      }
    }
    // Inicia a página carregando todos os peixes (busca vazia) e os dados do usuário
    document.addEventListener("DOMContentLoaded", () => {
      carregarUsuario();
    });
  </script>
</html>
